# Builds the pinned LLVM on each host and tests it. A tag publishes what was built as a
# release; nothing else does, so a pull request or a push to main is only the question
# "does this still build".
#
# A tag is `<llvm version>-<revision>`: 23.1.4-1 is the first build of 23.1.4, and
# 23.1.4-2 is the same LLVM built again with something here changed.

name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.os }}
    # A universal macOS build is two LLVMs on three cores.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: a Linux binary runs on a glibc at least as new as
          # the one it was built against, and the older one reaches more machines.
          - os: ubuntu-22.04
            host: Linux-x86_64
          - os: ubuntu-22.04-arm
            host: Linux-aarch64
          - os: macos-15
            host: Darwin-universal

    steps:
      - uses: actions/checkout@v4

      - name: ninja
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ninja-build
          fi

      - name: build
        run: ./build.sh "$RUNNER_TEMP/llvm"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.host }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: the tag names the pin
        run: |
          llvm=$(jq -r .llvm pin.json)
          case "$GITHUB_REF_NAME" in
          "$llvm"-[0-9]*) ;;
          *) echo "tag $GITHUB_REF_NAME is not $llvm-<revision>" >&2; exit 1 ;;
          esac

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 >dist/SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/*.tar.xz dist/SHA256SUMS \
            --title "LLVM $GITHUB_REF_NAME" \
            --notes "LLVM $(jq -r .llvm pin.json), RISC-V only: clang, lld, llvm-objcopy, llvm-nm and clang's headers. Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
